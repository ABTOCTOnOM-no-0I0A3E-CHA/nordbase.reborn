# Боевой запуск на VPS: приложение, Postgres и Caddy с автоматическим TLS.
#
#   docker compose -f docker-compose.prod.yml --profile tls up -d --build
#
# Если TLS и домен уже держит чужой прокси (nginx, Caddy на хосте, туннель),
# профиль tls не нужен — Caddy отсюда не поднимется, а приложение слушает
# APP_PORT на самом сервере:
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nordbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-nordbase}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nordbase}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не открываем: до базы достаточно доступа из сети compose.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nordbase}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nordbase}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-nb_session}
      SITE_URL: ${SITE_URL:?задайте SITE_URL, например https://nordbase.ru}
      SITE_NOINDEX: ${SITE_NOINDEX:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
    volumes:
      - uploads:/app/public/uploads
    # Порт нужен, когда TLS терминирует внешний прокси. По умолчанию слушаем
    # только петлю: наружу сайт отдаёт прокси, а не сам контейнер.
    ports:
      - '${APP_PORT:-127.0.0.1:3000}:3000'

  caddy:
    image: caddy:2-alpine
    # Поднимается только с --profile tls: на сервере, где домен уже висит на
    # чужом прокси, второй претендент на 80/443 просто не даст запуститься.
    profiles: ['tls']
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Без домена Caddy слушает голый 80 и не пытается выписать сертификат:
      # обязательная переменная здесь ломала бы запуск и без профиля tls,
      # потому что compose разбирает все сервисы разом.
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # тот же том, что и у приложения: Caddy раздаёт фото напрямую
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
